name: sql-test
on:
  pull_request:
    paths: ['supabase/**', 'tests/**', 'package.json']
  push:
    branches: [main]
    paths: ['supabase/**', 'tests/**', 'package.json']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
