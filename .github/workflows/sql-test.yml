name: sql-test
on:
  pull_request:
    paths: ['supabase/**', 'tests/**', 'ingest/**', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['supabase/**', 'tests/**', 'ingest/**', 'package.json', 'package-lock.json']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ingest
      - run: npm run test:transforms
      - run: npm run test:insights
      - run: npm run test:docparse
