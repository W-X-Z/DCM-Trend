# 기간 지정 백필 (수동 실행). 일일 호출 한도(약 2만 건)를 넘지 않도록 max_calls 로 끊는다.
name: ingest-backfill
on:
  workflow_dispatch:
    inputs:
      from:
        description: '시작일 (YYYY-MM-DD)'
        required: true
      to:
        description: '종료일 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      max_calls:
        description: 'OpenDART 호출 상한'
        required: false
        default: '15000'
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: node ingest/run.mjs backfill --from "${{ inputs.from }}" ${{ inputs.to && format('--to "{0}"', inputs.to) || '' }} --max-calls "${{ inputs.max_calls }}"
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
