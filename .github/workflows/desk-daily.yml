# 딜 발굴 데스크 (desk/): 뉴스 수집 → 모니터링 → 발굴 → 조사 → 1pager → 검수.
# 공시는 ingest-daily(07:10 KST)가 쌓은 것을 읽는다. 결과는 DB(mart.v_desk_*)와 이 실행의 요약·첨부(desk-out)에 남는다.
# 지금은 수동 실행만 둔다. 첫 실행에서 비용을 재고 나서 아래 예약 두 줄의 주석을 푼다(07:50 KST, 월~금).
# 오늘(KST) 이미 끝났거나 도는 실행이 있으면 바로 끝난다(force 로 다시 돌린다).
# 시크릿: ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OPENDART_API_KEY
# 선택(뉴스, 둘 중 한 쌍): NAVER_HUB_CLIENT_ID·NAVER_HUB_CLIENT_SECRET 또는 NAVER_CLIENT_ID·NAVER_CLIENT_SECRET
# 시크릿이 비어 있으면 실행하지 않고 끝난다(실패로 치지 않는다).
name: desk-daily
on:
  # schedule:
  #   - cron: '50 22 * * 0-4'
  workflow_dispatch:
    inputs:
      corp:
        description: '회사명 또는 corp_code (넣으면 그 회사의 1pager 만 만든다)'
        default: ''
      days:
        description: '읽을 공시·기사 기간(일)'
        default: '3'
      cap:
        description: '실행 비용 상한(달러)'
        default: '5'
      force:
        description: '오늘 이미 돌았어도 다시 돌린다'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_HUB_CLIENT_ID: ${{ secrets.NAVER_HUB_CLIENT_ID }}
      NAVER_HUB_CLIENT_SECRET: ${{ secrets.NAVER_HUB_CLIENT_SECRET }}
      DESK_USD_CAP: ${{ inputs.cap || '5' }}
    steps:
      - id: ready
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$OPENDART_API_KEY" ]; then
            echo "시크릿이 없어 실행하지 않음"; echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == '1'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.ready.outputs.ok == '1'
        env:
          CORP: ${{ inputs.corp }}
          DAYS: ${{ inputs.days || '3' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -n "$CORP" ]; then
            python3 -m desk brief "$CORP"
          else
            python3 -m desk daily --days "$DAYS" $FORCE
          fi
      - if: always() && steps.ready.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: desk-out
          path: desk/out/
          if-no-files-found: ignore
          retention-days: 30
